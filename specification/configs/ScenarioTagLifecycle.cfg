\* TLC_MODULE Scenarios
SPECIFICATION ScenarioSpec
CONSTANTS
    Ports = {1, 2}
    Endpoints = {e1, e2}
    Slots = {1, 2, 3}
    MACs = {macA, macB, macC}
    VLANs = {1, 10, 20, 30}
    Tokens = {0, 1, 2, 3, 4, 5, 6, 7}
    PortOrder <- OrderedPorts
    IfIndex <- Indices
    VlanToFdb <- FdbMap
    AgingTicks = 2
    PeriodTicks = 1
    FirstDelayTicks = 1
    QueueLimit = 8
    NoPort = NoPort
    NoSource = NoSource
    NoJob = NoJob
    Untagged = Untagged
    Scenario = "TagLifecycle"
    E1 = e1
    E2 = e2
    M1 = macA
    M2 = macB
    M3 = macC
INVARIANTS TypeOK InventoryOK FdbOK JobsOK MibOK TrapsOK ScenarioAssertions
PROPERTIES LearningHasSource StaleJobCannotCommit Completes
