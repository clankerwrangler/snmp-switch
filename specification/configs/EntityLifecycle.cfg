\* TLC_MODULE EntityScenarios
SPECIFICATION ScenarioSpec
CONSTANTS
    Ports = {1, 2}
    Endpoints = {e1}
    Slots = {1}
    MACs = {macA, macB}
    VLANs = {1, 10}
    Tokens = {0, 1, 2}
    PortOrder <- OrderedPorts
    IfIndex <- Indices
    VlanToFdb <- FdbMap
    AgingTicks = 2
    PeriodTicks = 1
    FirstDelayTicks = 1
    QueueLimit = 1
    NoPort = NoPort
    NoSource = NoSource
    NoJob = NoJob
    Untagged = Untagged
INVARIANTS TypeOK InventoryOK FdbOK JobsOK MibOK TrapsOK
PROPERTIES LearningHasSource StaleJobCannotCommit
INVARIANT EntityTypeOK
PROPERTIES StablePhysicalIdentity EntityTimestampCorrect EntityReadsAreSnapshots
INVARIANT ScenarioAssertions
PROPERTY Completes
