\* TLC_MODULE EntityInventory
SPECIFICATION EntitySpec
CONSTANTS
    Ports = {1, 65535}
    Endpoints = {e1}
    Slots = {1}
    MACs = {macA, macB}
    VLANs = {1}
    Tokens = {0, 1, 2}
    PortOrder <- SparsePorts
    IfIndex <- SparseIndices
    VlanToFdb <- FdbMap
    AgingTicks = 2
    PeriodTicks = 1
    FirstDelayTicks = 1
    QueueLimit = 1
    NoPort = NoPort
    NoSource = NoSource
    NoJob = NoJob
    Untagged = Untagged
INVARIANTS TypeOK InventoryOK FdbOK JobsOK MibOK TrapsOK
PROPERTIES LearningHasSource StaleJobCannotCommit
INVARIANT EntityTypeOK
PROPERTIES StablePhysicalIdentity EntityTimestampCorrect EntityReadsAreSnapshots
