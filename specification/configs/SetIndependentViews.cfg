\* TLC_MODULE SetScenarios
SPECIFICATION ScenarioSpec
CONSTANTS
    Ports = {1}
    Endpoints = {e1}
    Slots = {1}
    MACs = {macA}
    VLANs = {1, 10, 20}
    Tokens = {0, 1, 2}
    PortOrder <- OrderedPorts
    IfIndex <- Indices
    VlanToFdb <- FdbMap
    AgingTicks = 2
    PeriodTicks = 1
    FirstDelayTicks = 1
    QueueLimit = 1
    NoPort = NoPort
    NoSource = NoSource
    NoJob = NoJob
    Untagged = Untagged
    Credentials = {readerA, readerB}
    Secrets = {secretA, secretB}
    Views = {portView, vlanView}
    Snapshots = {snapshotA}
    Targets = {targetA}
    NoCredential = NoCredential
    NoView = NoView
    NoRequest = NoRequest
    NoResponse = NoResponse
    NoPdu = NoPdu
    Scenario = "IndependentViews"
INVARIANTS TypeOK InventoryOK FdbOK JobsOK MibOK TrapsOK
PROPERTIES LearningHasSource StaleJobCannotCommit
INVARIANT SetTypeOK
PROPERTIES FailedSetPreservesState SuccessfulSetIsAtomic SuccessfulSetIsAuthorized Completes
INVARIANT ScenarioAssertions
