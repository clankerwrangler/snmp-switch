services:
  switchlab:
    build:
      context: .
      target: runtime
    image: switchlab:0.1.0
    ports:
      - target: 8000
        published: "${SWITCHLAB_HTTP_PORT:-8000}"
        host_ip: "${SWITCHLAB_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
      - target: ${SWITCHLAB_SNMP_PORT:-161}
        published: "${SWITCHLAB_SNMP_PORT:-161}"
        host_ip: "${SWITCHLAB_BIND_ADDRESS:-127.0.0.1}"
        protocol: udp
    environment:
      SWITCHLAB_SECURE_COOKIES: "${SWITCHLAB_SECURE_COOKIES:-0}"
    volumes:
      - switchlab-data:/data
    secrets:
      - config_key
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "161"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    restart: unless-stopped
secrets:
  config_key:
    file: ./secrets/config.key
volumes:
  switchlab-data:
