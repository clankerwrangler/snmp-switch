services:
  switchlab:
    build:
      context: .
      target: runtime
    image: switchlab:0.1.0
    ports:
      - target: 8000
        published: "8000"
        host_ip: "${SWITCHLAB_BIND_ADDRESS:-127.0.0.1}"
        protocol: tcp
      - target: 1161
        published: "1161"
        host_ip: "${SWITCHLAB_BIND_ADDRESS:-127.0.0.1}"
        protocol: udp
    environment:
      SWITCHLAB_SECURE_COOKIES: "${SWITCHLAB_SECURE_COOKIES:-0}"
    volumes:
      - switchlab-data:/data
    secrets:
      - config_key
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    restart: unless-stopped
secrets:
  config_key:
    file: ./secrets/config.key
volumes:
  switchlab-data:
